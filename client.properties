# Default server the clients connect to. Read at build time.
# To override without touching this file, create client.local.properties
# (git-ignored) with any of these keys, or pass -Pserver.host=... -Pserver.port=...

# Port the game server listens on.
server.port=12345

# Desktop CLI/GUI. 
desktop.server.host=localhost

# Android. 10.0.2.2 reaches the host machine from the emulator;
# for a physical phone use the server's LAN IP (see `make ip`).
android.server.host=10.0.2.2
